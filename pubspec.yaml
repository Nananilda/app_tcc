name: app_tcc
description: "ÁKRON — aplicativo do Sistema de Monitoramento Industrial"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^17.4.0
  provider: ^6.1.2
  fl_chart: ^1.2.0
  intl: 0.20.2
  http: ^1.2.0
  shared_preferences: ^2.5.0
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  http_parser: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Logos da marca ÁKRON (máscaras brancas com transparência, tingidas em
  # tempo de execução conforme o tema claro/escuro — ver widgets/akron_logo.dart)
  assets:
    - assets/images/

  # Tipografia da marca: Montserrat nos títulos, Inter no texto.
  # Licença SIL OFL 1.1 (arquivos LICENCA-*-OFL.txt em assets/fonts/).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
